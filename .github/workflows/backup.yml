name: Weekly encrypted D1 backup
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @vpass/api...
      - run: sudo apt-get install -y age
      - name: Export and encrypt (contents are already ciphertext; age protects metadata like emails and counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          pnpm --filter @vpass/api exec wrangler d1 export DB --remote --output /tmp/vpass.sql
          age -r "$AGE_RECIPIENT" -o "vpass-$(date -u +%Y%m%d).sql.age" /tmp/vpass.sql
          shred -u /tmp/vpass.sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpass-backup
          path: vpass-*.sql.age
          retention-days: 90
