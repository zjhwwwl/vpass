name: Weekly encrypted D1 backup
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @vpass/api...
      - run: sudo apt-get install -y age
      - name: Export and encrypt (contents are already ciphertext; age protects metadata like emails and counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          pnpm --filter @vpass/api exec wrangler d1 export DB --remote --output /tmp/vpass.sql
          age -r "$AGE_RECIPIENT" -o "vpass-$(date -u +%Y%m%d).sql.age" /tmp/vpass.sql
          shred -u /tmp/vpass.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vpass-backup
          path: vpass-*.sql.age
          retention-days: 90
